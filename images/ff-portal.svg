<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'Noto Sans JP','Hiragino Sans',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2530"/>
      <stop offset="1" stop-color="#16394a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- before: scattered channels -->
  <g opacity="0.9">
    <rect x="48" y="90" width="150" height="54" rx="12" fill="#1f4a5c"/>
    <text x="123" y="124" text-anchor="middle" font-size="20" fill="#cfe9ef">LINE</text>
    <rect x="48" y="170" width="150" height="54" rx="12" fill="#1f4a5c"/>
    <text x="123" y="204" text-anchor="middle" font-size="20" fill="#cfe9ef">Discord</text>
    <rect x="48" y="250" width="150" height="54" rx="12" fill="#1f4a5c"/>
    <text x="123" y="284" text-anchor="middle" font-size="20" fill="#cfe9ef">紙・口頭</text>
  </g>
  <g stroke="#7AE2CF" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M206 117 C 250 117, 250 195, 300 195"/>
    <path d="M206 197 L 300 197"/>
    <path d="M206 277 C 250 277, 250 199, 300 199"/>
    <path d="M292 189 L 302 197 L 292 205"/>
  </g>

  <!-- after: one app -->
  <rect x="320" y="60" width="430" height="480" rx="24" fill="#f4fbfc"/>
  <rect x="320" y="60" width="430" height="64" rx="24" fill="#7AE2CF"/>
  <rect x="320" y="100" width="430" height="24" fill="#7AE2CF"/>
  <text x="348" y="101" font-size="22" font-weight="700" fill="#06202B">練習ポータル</text>
  <circle cx="712" cy="92" r="14" fill="#06202B" opacity="0.15"/>
  <path d="M705 97 h14 l-2 -3 v-6 a5 5 0 0 0 -10 0 v6 z M709 99 a3 3 0 0 0 6 0" fill="#06202B"/>

  <!-- week -->
  <g font-size="15" fill="#4a6670" text-anchor="middle">
    <text x="372" y="160">月</text><text x="430" y="160">火</text><text x="488" y="160">水</text>
    <text x="546" y="160">木</text><text x="604" y="160">金</text><text x="662" y="160">土</text><text x="716" y="160">日</text>
  </g>
  <g>
    <rect x="350" y="172" width="44" height="44" rx="10" fill="#06202B"/>
    <rect x="408" y="172" width="44" height="44" rx="10" fill="#e3eef1"/>
    <rect x="466" y="172" width="44" height="44" rx="10" fill="#06202B"/>
    <rect x="524" y="172" width="44" height="44" rx="10" fill="#06202B"/>
    <rect x="582" y="172" width="44" height="44" rx="10" fill="#e3eef1"/>
    <rect x="640" y="172" width="44" height="44" rx="10" fill="#e3eef1"/>
    <rect x="694" y="172" width="44" height="44" rx="10" fill="#e3eef1"/>
  </g>
  <g font-size="13" fill="#7AE2CF" text-anchor="middle">
    <text x="372" y="199">練習</text><text x="488" y="199">練習</text><text x="546" y="199">練習</text>
  </g>

  <!-- event card -->
  <rect x="350" y="240" width="370" height="118" rx="16" fill="#ffffff" stroke="#d6e6ea"/>
  <text x="372" y="274" font-size="18" font-weight="700" fill="#06202B">水曜 18:00 全体練習</text>
  <text x="372" y="300" font-size="14" fill="#4a6670">出欠をワンタップで回答</text>
  <rect x="372" y="316" width="96" height="30" rx="15" fill="#7AE2CF"/>
  <text x="420" y="336" font-size="14" text-anchor="middle" fill="#06202B" font-weight="700">出席</text>
  <rect x="480" y="316" width="96" height="30" rx="15" fill="#e3eef1"/>
  <text x="528" y="336" font-size="14" text-anchor="middle" fill="#4a6670">欠席</text>
  <rect x="588" y="316" width="110" height="30" rx="15" fill="#e3eef1"/>
  <text x="643" y="336" font-size="14" text-anchor="middle" fill="#4a6670">遅刻・早退</text>

  <!-- attendance bar -->
  <text x="372" y="398" font-size="15" fill="#4a6670">回答状況</text>
  <rect x="372" y="410" width="326" height="16" rx="8" fill="#e3eef1"/>
  <rect x="372" y="410" width="290" height="16" rx="8" fill="#7AE2CF"/>

  <!-- notice -->
  <rect x="350" y="450" width="370" height="64" rx="16" fill="#06202B"/>
  <text x="372" y="478" font-size="15" fill="#7AE2CF" font-weight="700">お知らせ</text>
  <text x="372" y="500" font-size="14" fill="#cfe9ef">鍵の受け渡し・予定変更もここで共有</text>

  <text x="48" y="400" font-size="22" font-weight="700" fill="#ffffff">連絡を一つに。</text>
  <text x="48" y="432" font-size="16" fill="#cfe9ef">約150名のサークル向け</text>
  <text x="48" y="458" font-size="16" fill="#cfe9ef">練習管理Webアプリ</text>
</svg>
